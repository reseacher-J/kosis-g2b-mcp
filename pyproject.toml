[project]
name = "kosis-g2b-mcp"
version = "0.2.0"
description = "MCP server for Korean public-investment analysis: KOSIS statistics (CPI, construction cost index, any table) and KONEPS (나라장터) construction bid notices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "reseacher-J" }]
keywords = ["mcp", "model-context-protocol", "kosis", "koneps", "g2b", "korea", "public-investment", "open-data", "claude"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Korean",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=1.2.0,<2",  # 2.x renamed FastMCP -> MCPServer
  "requests>=2.28",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/reseacher-J/kosis-g2b-mcp"
Blog = "https://blog.naver.com/pmisjeong"

[project.scripts]
kosis-g2b-mcp = "kosis_g2b_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kosis_g2b_mcp"]
